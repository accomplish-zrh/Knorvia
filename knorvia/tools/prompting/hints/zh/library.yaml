short_description: "个人资料库：Markdown、CSV、HTML、Word、Excel、画布和上传文件。没有团队空间。"
when_to_use: "用户要列出、阅读、新建或改资料库里的文档、页面、表格、Word 或画布时使用；也要在用户想离线转换已上传的图片/音频/视频/PDF 文件格式时使用。"
input_format: |
  {"list": true}
  {"read_id": "lib_entry_..."}
  {"create_kind": "markdown|csv|html|word|excel|canvas|folder|text", "title": "...", "content": "...", "parent_id": "可选文件夹 id"}
  {"write_id": "lib_entry_...", "content": "...", "title": "可选重命名"}
  {"convert_id": "lib_entry_...", "target": "png|jpg|webp|mp3|wav|ogg|m4a|mp4|webm|txt", "title": "可选新条目名"}
guideline: "需要 id 时先 list=true。Word/Excel 用 create_kind=word|excel 写出真正的 .docx/.xlsx。没有团队文档。不要编造条目 id。离线转换只作用于上传的媒体/PDF 文件：先只给 convert_id（不带 target）可查询该文件支持的转换目标；转换成功会产生一个新的资料库条目。"
