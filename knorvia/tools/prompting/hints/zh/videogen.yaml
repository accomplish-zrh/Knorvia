short_description: "通过视频创作工作台，用已分配的模型生成一个视频任务。"
when_to_use: "用户要生成视频、图生视频（首帧/首尾帧）、续写上一段、短剧分镜规划时使用。所有视频都走 videogen，不调用原始 generate_video。"
input_format: "prompt 逐字来自用户。可选 operation=text_to_video|image_to_video|video_to_video|extend|remix|edit、reference_mode、audio_mode、aspect_ratio、duration、resolution、seed、input_asset_ids、input_roles、character_ids（逗号分隔的角色库 id，免费参考图组装）、board_node_id、storyboard_shot_id（分镜 id、从 1 起的序号或标题）、iterate_from、template、list_board、list_characters、action=plan_episode + shots（可含 keyframe_prompt 仅存储，及 characters 逐镜绑定角色）、action=analyze_script（prompt 为剧本文本）、action=apply_production（用户在工作台确认审阅之后）、keyframe_for_shot + keyframe_prompt（单镜首帧，付费，走确认）、voiceover_shot + voiceover_text + voiceover_voice（单镜配音，付费，走确认）、compose_project + compose_subtitle|compose_resolution（本地成片，免费）、cancel_job_id。"
guideline: "视频统一走 Video Studio：用户 prompt 必须逐字传递，绝不改写、翻译或润色；每次用户消息最多一个付费任务。新会话写入用户当前打开的视频工作台项目，不要另开一个 Chat 项目。第一次调用会暂停确认，用户同意后用完全相同的参数再调一次。看画布和分镜条用 list_board=true（免费）；看角色库用 list_characters=true（免费）——涉及角色一致性时先列角色再规划，shots 里只引用真实存在的角色 id。摆流水线用 template=shot-i2v|first-last|storyboard-6|character-episode|extend-chain|character-card（免费，不发任务，带 prompt 也只对第一张卡起一个待确认任务）；把结果填进已有生成卡传 board_node_id；填分镜条用 storyboard_shot_id（可省略 prompt，沿用该镜已存提示词）。从画布上的视频续写或图片作首帧时传 iterate_from（节点 id 或 asset id）。input_roles 与 input_asset_ids 一一对应：reference|first-frame|last-frame|audio|continue-from。character_ids 会把每个角色的参考图（三视图优先）并入任务参考输入，属于免费资产组装，不额外调用 provider。用户说“做一部短剧/分镜”时先（若涉及角色）list_characters=true，再 action=plan_episode 加 shots=[{\"title\",\"prompt\",\"duration\",\"keyframe_prompt\"?,\"characters\"?}]（由你撰写分镜 JSON，角色出场的镜头挂上对应 id），它只写 storyboard 和画布生成卡，零 provider 调用、零任务；然后提示用户逐条消息说“生成第 N 镜”并传 storyboard_shot_id=1 来确认。粘贴剧本用 action=analyze_script；用户在工作台确认审阅后再 action=apply_production 写入分镜。分镜补画面用 keyframe_for_shot=<shot id 或序号>（付费，走确认），补旁白用 voiceover_shot=<shot id 或序号> + voiceover_text（付费，走确认），两者每次只能传一个。用户要成片时传 compose_project=true：合成不产生 provider 费用，可直接执行，无需确认。排队成功不代表视频已生成完成，不要提前宣称完成。"
note: "不要编造模型或分辨率。工具只允许已授权的视频模型。多镜请求绝不静默连发多个任务。不要编造角色 id——先 list_characters 再引用。优先落在当前打开的视频工作台项目，不要另建 Chat 项目。"
phase: "synthesis"
