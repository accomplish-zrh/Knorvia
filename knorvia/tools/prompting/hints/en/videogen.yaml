short_description: "Create one asynchronous video job through Video Studio with an assigned model."
when_to_use: "Use when the user wants a video, image-to-video (first / first+last frame), an extension of a previous clip, or a short-drama shot plan. Route every video through videogen; never call the raw generate_video."
input_format: "prompt verbatim from the user. Optional operation=text_to_video|image_to_video|video_to_video|extend|remix|edit, reference_mode, audio_mode, aspect_ratio, duration, resolution, seed, input_asset_ids, input_roles, character_ids (comma-separated library ids, free reference assembly), board_node_id, storyboard_shot_id (shot id, 1-based index, or title), iterate_from, template, list_board, list_characters, action=plan_episode + shots (may carry keyframe_prompt, stored only, and characters for per-shot identity), action=analyze_script (prompt = script text), action=apply_production (after the user confirms review in Video Studio), keyframe_for_shot + keyframe_prompt (one shot's first frame, paid, confirmation), voiceover_shot + voiceover_text + voiceover_voice (one shot's TTS narration, paid, confirmation), compose_project + compose_subtitle|compose_resolution (local composition, free), cancel_job_id."
guideline: "Use Video Studio. Do not call raw generate_video. Do not rewrite the user's prompt. One paid job per message. New sessions write into the Video Studio project the user currently has open; do not invent a second project. The first call pauses for cost confirmation; after the user approves, call once more with exactly the same arguments. list_board=true reads the canvas and storyboard strip for free. list_characters=true reads the project's character library for free — call it before planning so shots reference real ids. template=shot-i2v|first-last|storyboard-6|character-episode|extend-chain|character-card stamps pipeline cards for free (no jobs; with a prompt it still starts only one confirmable job on the first card). board_node_id fills that existing generate card. storyboard_shot_id fills that storyboard shot (and its canvas card); omit prompt to use the stored shot prompt. iterate_from branches a new card from a canvas video (continue-from) or image (first-frame) — node id or asset id. input_roles parallels input_asset_ids: reference|first-frame|last-frame|audio|continue-from. character_ids merges each character's reference images (three-view sheet first) into the job inputs as reference — free asset assembly, no extra provider call. When the user asks for a multi-shot episode, first call list_characters=true if identity matters, then action=plan_episode with shots=[{\"title\",\"prompt\",\"duration\",\"keyframe_prompt\"?,\"characters\"?}] (you author the shot list; attach character ids where that character appears): it writes the storyboard and canvas cards with zero provider calls and zero jobs, then tell the user to confirm each shot in its own message with storyboard_shot_id=1 (or '第1镜'). For a pasted script use action=analyze_script; after they confirm review in Video Studio, action=apply_production writes the shots. To add a shot's still, pass keyframe_for_shot=<shot id or index> (paid, confirmation); for narration pass voiceover_shot=<shot id or index> + voiceover_text (paid, confirmation) — never both in one call. For the final cut pass compose_project=true: composition causes no provider cost and can run directly without confirmation. A queued job is not a finished video — never claim completion from the queued result."
note: "Do not invent models or resolutions. The tool picks a granted video model. Never silently fire multiple jobs for a multi-shot request. Never invent character ids — list them first. Prefer the open Video Studio project over creating a new Chat project."
phase: "synthesis"
