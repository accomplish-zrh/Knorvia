short_description: "Create or revise images through Image Studio with an assigned model."
when_to_use: "Use when the user wants a picture generated, edited, locally redrawn, enhanced to 1K/2K/4K, iterated from a previous image, a three-view or product set on the canvas, or a result placed on a specific board card. Prefer this over describing an image in text. Do not interview the user for optional parameters."
input_format: "prompt plus operation=generate|edit|inpaint|enhance. Optional n, size, aspect_ratio, target_resolution, input_asset_ids, parent_job_id, board_node_id, iterate_from, template, list_board, confirmed."
guideline: "Route every picture through imagegen so it lands on the session Image Studio canvas. One sentence is enough: use defaults for ratio, quality, and count. Generate for a new scene. Edit when the user attached or named a reference, or when iterating on a previous result (pass input_asset_ids or parent_job_id). Inpaint only with a mask. Enhance for 1K/2K/4K. To fill an existing card, pass board_node_id. To branch from an image already on the board, pass iterate_from (node id or asset id). For a character turnaround, pass template=three-view (also product-set or picture-book). Use list_board=true to read current card ids. Ask only one short question if a required image is missing. Costly jobs and multi-card templates pause for approval: after Proceed, call again with the same arguments; after Cancel, stop. Do not invent a confirmed=true argument. Mention each result by its exact filename and that it is saved on the Image Studio canvas."
note: "Do not invent models. The tool picks a granted, capable Image Studio model. Never claim a picture was made if the tool failed."
phase: "synthesis"
