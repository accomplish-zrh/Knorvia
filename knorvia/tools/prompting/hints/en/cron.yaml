short_description: "Schedule recurring agent tasks on this machine."
when_to_use: "When the user wants a reminder or a recurring job that this agent should run later."
input_format: |
  {"action": "list"}
  {"action": "create", "title": "...", "prompt": "...", "cron": "0 9 * * *"}
guideline: "List existing jobs before creating duplicates. Keep the scheduled prompt self-contained. Do not invent cron ids."
