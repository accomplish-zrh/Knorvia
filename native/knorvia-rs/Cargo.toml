[workspace]
resolver = "2"
members = [
    "platform-paths",
    "protocol",
    "store",
    "control",
    "daemon",
    "cli",
    "provider-gateway",
    "capability-host",
    "migration",
    "kernel-adapter",
    "packs",
]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
knorvia-platform-paths = { path = "platform-paths" }
knorvia-protocol = { path = "protocol" }
knorvia-store = { path = "store" }
knorvia-control = { path = "control" }
knorvia-provider-gateway = { path = "provider-gateway" }
knorvia-capability-host = { path = "capability-host" }
knorvia-migration = { path = "migration" }
knorvia-kernel-adapter = { path = "kernel-adapter" }
knorvia-packs = { path = "packs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
