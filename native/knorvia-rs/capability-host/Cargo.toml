[package]
name = "knorvia-capability-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Capability Pack install/invoke/cancel/resume/uninstall with readable history."

[dependencies]
knorvia-platform-paths = { workspace = true }
knorvia-protocol = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
knorvia-store = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
