name: Tests

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "knorvia/**"
      - "knorvia_cli/**"
      - "tests/**"
      - "requirements/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "uv.lock"
      - "web/**"
      - "desktop/**"
      - "scripts/**"
      - "CITATION.cff"
      - "Dockerfile"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "knorvia/**"
      - "knorvia_cli/**"
      - "tests/**"
      - "requirements/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "uv.lock"
      - "web/**"
      - "desktop/**"
      - "scripts/**"
      - "CITATION.cff"
      - "Dockerfile"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.3

      - name: Run Ruff lint
        run: ruff check knorvia knorvia_cli tests scripts

      - name: Run Ruff format check
        run: ruff format --check knorvia knorvia_cli tests scripts

      - name: Enforce architecture size budgets
        run: python scripts/architecture_guard.py

  security-audit:
    name: Security and Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Python source and dependencies
        env:
          PYTHONUTF8: "1"
        run: |
          python -m pip install bandit pip-audit uv
          bandit -q -lll -r knorvia knorvia_cli -c pyproject.toml
          uv export --frozen --all-extras --no-dev --no-emit-project --format requirements-txt --output-file audit-requirements.txt
          pip-audit -r audit-requirements.txt --no-deps --ignore-vuln PYSEC-2026-113
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Audit production Web dependencies
        working-directory: web
        run: npm audit --registry=https://registry.npmjs.org --omit=dev --audit-level=high

  web-tests:
    name: Web Node Tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --legacy-peer-deps

      - name: Run frontend node tests
        working-directory: web
        run: npm run test:node

      - name: Run frontend lint
        working-directory: web
        run: npm run lint:ci

  web-build:
    name: Web Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies (clean)
        working-directory: web
        run: npm ci --legacy-peer-deps

      - name: Type-check (tsc)
        working-directory: web
        run: npx tsc --noEmit

      - name: Production build (next build)
        working-directory: web
        run: npm run build

  web-release-smoke:
    name: Critical Playwright Smoke (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --legacy-peer-deps
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run release smoke journeys
        working-directory: web
        run: npm run audit:release

  import-check:
    name: Import Check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        experimental: [false]
        include:
          - python-version: "3.14"
            experimental: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install minimal dependencies for import check
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/server.txt

      - name: Check module imports
        run: |
          echo "Testing with Python ${{ matrix.python-version }}"
          python -c "from knorvia.runtime.orchestrator import ChatOrchestrator; print('Orchestrator imports OK')"
          python -c "from knorvia.runtime.registry.tool_registry import get_tool_registry; print('Tool registry imports OK')"
          python -c "from knorvia.runtime.registry.capability_registry import get_capability_registry; print('Capability registry imports OK')"
          python -c "from knorvia.services.config.runtime_settings import RuntimeSettingsService; print('RuntimeSettingsService imports OK')"
          python -c "from knorvia.api.routers.unified_ws import unified_websocket; print('Unified WS imports OK')"
          python -c "from knorvia.services.prompt.manager import PromptManager; print('Prompt manager imports OK')"
          python -c "from knorvia.logging import configure_logging, bind_log_context, capture_process_logs, ProcessLogEvent; print('Logging imports OK')"
          python -c "from knorvia.services.sandbox.runner import server; print('Sandbox runner imports OK')"
        env:
          PYTHONPATH: ${{ github.workspace }}

  wheel-install:
    name: Plain Wheel Install (Ubuntu · Py3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the plain wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir wheelhouse

      - name: Install the built wheel with the full app profile
        run: |
          python -m venv "$RUNNER_TEMP/knorvia-wheel"
          "$RUNNER_TEMP/knorvia-wheel/bin/python" -m pip install --upgrade pip
          WHEEL=$(ls wheelhouse/knorvia-*.whl)
          "$RUNNER_TEMP/knorvia-wheel/bin/python" -m pip install "${WHEEL}[app]"

      - name: Probe default runtime dependencies and routes outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/knorvia-wheel/bin/python" - <<'PY'
          import croniter
          import mcp
          import knorvia
          from knorvia.api.main import app
          from knorvia.services.video_studio.provider import get_video_studio_adapter

          paths = set(app.openapi().get("paths", {}))
          required = {
              "/api/v1/cron/jobs",
              "/api/v1/settings/mcp",
              "/api/v1/video-studio/models",
              "/api/v1/video-studio/assets/{asset_id}/content",
              "/api/v1/video-studio/projects/{project_id}/export",
          }
          missing = sorted(required - paths)
          if missing:
              raise SystemExit(f"missing wheel routes: {missing}")
          for adapter in ("async_task", "openai_videos", "volcengine_async_task"):
              get_video_studio_adapter(adapter)
          print(f"plain wheel {knorvia.__version__}: imports and routes OK")
          PY

  python-tests:
    name: Python Tests (${{ matrix.os }} · Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      # Chinese locale CI machines must not fall back to GBK for UTF-8 files.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8:replace"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies from a clean environment
        # Requirements files only — no editable install, so a missing declared
        # dependency fails here instead of being masked by a developer venv.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/server.txt
          pip install -r requirements/partners.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Create minimal runtime config (POSIX)
        if: runner.os != 'Windows'
        run: |
          mkdir -p data/user/settings
          printf 'system:\n  language: en\nlogging:\n  level: WARNING\n' > data/user/settings/main.yaml

      - name: Create minimal runtime config (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path data\user\settings | Out-Null
          Set-Content -Path data\user\settings\main.yaml -Value "system:`n  language: en`nlogging:`n  level: WARNING`n" -Encoding utf8

      - name: Run full Python tests
        run: >-
          pytest -q
          --cov=knorvia
          --cov=knorvia_cli
          --cov-report=term-missing:skip-covered
          --cov-report=xml
          --cov-fail-under=60
        env:
          PYTHONPATH: ${{ github.workspace }}

  desktop-package:
    name: Desktop Package (Windows)
    runs-on: windows-latest
    # The installer build is the release gate: run it on main/dev pushes and
    # manual dispatch; PRs are gated by the test and web-build jobs instead.
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install uv
        run: python -m pip install uv

      - name: Build desktop installer + portable folder
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build_windows_desktop.ps1

      - name: Verify packaged runtime, routes, dependencies and version
        run: python scripts/release/check_package.py release

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: knorvia-windows-installer
          path: release/Knorvia-*-setup.exe
          if-no-files-found: error

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: knorvia-windows-portable
          path: release/Knorvia-*-portable.zip
          if-no-files-found: error

      - name: Upload SHA-256 manifest
        uses: actions/upload-artifact@v4
        with:
          name: knorvia-windows-sha256
          path: release/Knorvia-*-SHA256SUMS.txt
          if-no-files-found: error

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [lint, security-audit, web-tests, web-build, web-release-smoke, import-check, wheel-install, python-tests, desktop-package]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Ruff (Ubuntu) | ${{ needs.lint.result == 'success' && 'Passed' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security/dependency audit | ${{ needs.security-audit.result == 'success' && 'Passed' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Web node tests (Ubuntu) | ${{ needs.web-tests.result == 'success' && 'Passed' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Web build + tsc (Ubuntu/Windows) | ${{ needs.web-build.result == 'success' && 'Passed' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Critical Playwright smoke (Ubuntu) | ${{ needs.web-release-smoke.result == 'success' && 'Passed' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Import check (3.11/3.12/3.13; 3.14 best-effort) | ${{ needs.import-check.result == 'success' && 'Passed' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Plain wheel install (3.12) | ${{ needs.wheel-install.result == 'success' && 'Passed' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python tests (Ubuntu/Windows · 3.11/3.12) | ${{ needs.python-tests.result == 'success' && 'Passed' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Desktop package (Windows) | ${{ needs.desktop-package.result == 'success' && 'Passed' || 'Skipped (PR)' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if a required job failed
        # The Linux python-tests leg is the release gate; desktop-package is
        # required on branch pushes but intentionally skipped on PRs.
        if: |
          needs.lint.result == 'failure' ||
          needs.security-audit.result == 'failure' ||
          needs.web-tests.result == 'failure' ||
          needs.web-build.result == 'failure' ||
          needs.web-release-smoke.result == 'failure' ||
          needs.import-check.result == 'failure' ||
          needs.wheel-install.result == 'failure' ||
          needs.python-tests.result == 'failure' ||
          (needs.desktop-package.result == 'failure')
        run: exit 1
